[project]
name = "mcp-presentation"
version = "1.0.0"
description = "MCP server for AI-assisted presentation generation. Create PowerPoint slides from structured content with templates and styling."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.23.0,<2",
    "python-pptx>=0.6.21",
    "Pillow>=10.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/presentation_gen"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.21",
]

[project.scripts]
presentation-gen = "presentation_gen:main"
